name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Raspberry Pi OS bookworm; 3.9 = bullseye. The Pi runs the
        # system python3, so the server must import and pass on both.
        python: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  drift:
    name: Codebase drift + ops lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Mechanical cross-references: message types vs handlers, engine params
      # vs both engines, error codes vs docs, units vs installers.
      - run: python3 tools/codebase_map.py --check --quiet
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -S warning scripts/*.sh
      # systemd unit files: every directive must be valid for its section
      # (a misplaced StartLimitIntervalSec is silently ignored on the Pi)
      - run: pip install pytest && python -m pytest tests/test_systemd_units.py -q
      - name: systemd-analyze verify
        run: |
          # Verifies syntax and directive placement with the real systemd.
          # Only unit-file parse problems fail the job (a misplaced or
          # misspelled directive, a missing '='). Runner-environment noise -
          # User= naming a Pi-only account, other units on the runner
          # failing to load - is ignored.
          out=$(systemd-analyze verify scripts/systemd/*.service 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -E "cricket-[a-z]+\.service" | grep -qE "Unknown (key name|section)|Missing '='|Failed to parse|Failed to resolve|Invalid (value|argument|slot)|Assignment outside of section"; then
            echo "systemd-analyze reported a unit-file problem"; exit 1
          fi

  frontend:
    name: Frontend (tsc + eslint + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      # Tests are excluded from the app build; type-check them separately
      - run: npx tsc -p tsconfig.test.json
      - run: npx eslint src tools/parity
      - run: npx vitest run
      # dist/ is the artefact the phone receives - it must build, not just type-check
      - run: npm run build

  engine-parity:
    name: Cross-engine golden parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      # The shots_sha stamp proves both runners read the SAME shots.json - not
      # that shots.json matches gen_shots.py. Without this, editing the shot
      # generator and forgetting to commit the regenerated file means CI grades
      # the old shot set and passes.
      - name: shots.json is current with gen_shots.py
        run: |
          python3 tools/parity/gen_shots.py
          git diff --exit-code tools/parity/shots.json
      - run: python3 tools/parity/run_py.py
      - run: npx tsx tools/parity/run_ts.ts
      - run: python3 tools/parity/compare.py
