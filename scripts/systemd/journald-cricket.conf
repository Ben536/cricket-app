# Installed to /etc/systemd/journald.conf.d/cricket.conf by deploy_to_pi.sh /
# install_services.sh.
#
# Nothing bounded the journal before. A data-gathering session can log for
# hours, and a full SD card takes SQLite and the recorder down with it. Cap
# the persistent journal well below what a recording needs.
[Journal]
# Persistent so a field failure can be read after the next boot (Raspberry
# Pi OS defaults to a volatile journal, which is lost on power-cut). The cap
# keeps it far below what one recording session writes.
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
MaxRetentionSec=1month
